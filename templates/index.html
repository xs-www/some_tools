<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>正在载入…</title>
  <script>
    // 入口页：根据 localStorage 的 token 决定去向
    (function(){
      try{
        var token = localStorage.getItem('token');
        if (token) {
          window.location.href = '/ui/home';
        } else {
          window.location.href = '/login';
        }
      }catch(e){
        // 出错则前往登录页
        window.location.href = '/login';
      }
    })();
  </script>
</head>
<body>
  <p>正在检查登录状态，如未跳转请 <a href="/login">点击此处登录</a>。</p>
</body>
</html>
